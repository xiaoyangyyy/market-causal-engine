[project]
name = "market-causal-engine"
version = "0.3.0"
description = "Trace-first market event causal forensics (earnings, short report, macro) with historical case library"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
market-causal = "market_causal_engine.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
