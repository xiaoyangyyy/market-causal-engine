name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]" ruff
      - name: Ruff (Step A-E modules)
        run: make lint

  market-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,platform,api,demo]"
      - name: Run market tests (exclude World Cup legacy)
        run: make test-market
      - name: Export killer demo (smoke)
        run: make demo-static

  reproduce-benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,platform,api]"
      - name: Reproduce headline benchmark (smoke)
        run: make reproduce-benchmark-smoke
      - name: Upload reproduce manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce-manifest
          path: results/reproduce/LATEST.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build smoke
        run: make docker-build

  worldcup-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[worldcup]"
      - name: World Cup legacy tests
        run: make test-worldcup
